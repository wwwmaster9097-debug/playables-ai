
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYABLES AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#18202c;font-family:Arial,sans-serif;padding:22px}
header{text-align:center;padding:25px 0}
.logo{font-size:30px;font-weight:900;color:#635bff}
p{color:#70798a}
.card{background:white;padding:20px;border-radius:18px;margin:15px 0;box-shadow:0 4px 20px #00000009}
h2{font-size:20px}
label{display:block;font-weight:bold;margin:15px 0 8px}
input,select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:white}
textarea{height:100px;resize:vertical}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#635bff;color:white;font-size:17px;font-weight:bold;margin-top:15px}
.result{white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<header>
<div class="logo">▶ PLAYABLES AI</div>
<p>AI Gaming Video Creator</p>
</header>

<div class="card">
<h2>🎮 Create your video</h2>

<label>Video prompt</label>
<textarea id="prompt" placeholder="Describe your gaming video..."></textarea>

<label>Video format</label>
<select id="format">
<option>Shorts 9:16</option>
<option>Long 16:9</option>
</select>

<label>Video duration</label>
<select id="duration">
<option>30 seconds</option>
<option>60 seconds</option>
<option>5 minutes</option>
<option>7 minutes</option>
<option>10 minutes</option>
</select>

<label>Video source</label>
<select id="source">
<option>AI generated footage</option>
<option>My own gameplay</option>
</select>

<label>AI Voice</label>
<select id="voice">
<option>English</option>
<option>Uzbek</option>
</select>

<label>Upload gameplay</label>
<input type="file" id="video" accept="video/*">

<button onclick="createVideo()">✨ Create AI Script</button>
</div>

<div class="card" id="output" style="display:none">
<h2>🎬 Your video script</h2>
<div class="result" id="result"></div>
</div>

<script>
function createVideo(){
const prompt=document.getElementById('prompt').value.trim();
if(!prompt){alert('Please enter your video idea!');return;}

const format=document.getElementById('format').value;
const duration=document.getElementById('duration').value;
const voice=document.getElementById('voice').value;

const script=`
🔥 HOOK:
You won't believe what happens next!

🎮 VIDEO IDEA:
${prompt}

😂 FUNNY MOMENT:
Add a funny gaming moment and meme.

🎙️ AI VOICE:
${voice}

📱 FORMAT:
${format}

⏱️ DURATION:
${duration}

🚀 CALL TO ACTION:
Subscribe to PLAYABLES GAMING for more amazing videos!
`;

document.getElementById('result').textContent=script;
document.getElementById('output').style.display='block';
}
</script>
</body>
</html>
